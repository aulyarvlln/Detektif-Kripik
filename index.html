<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detektif Kripik</title>
    <!-- Menggunakan Tailwind CSS via CDN untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Kustomisasi scrollbar agar sesuai tema */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1c23;
      }
      ::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563;
      }
    </style>
  </head>
  <body
    class="bg-[#12141a] text-gray-300 font-sans h-screen flex flex-col overflow-hidden select-none"
  >
    <!-- Top Navigation / Title Bar -->
    <header
      class="flex justify-between items-center px-4 py-2 bg-[#12141a] border-b border-gray-800 text-sm"
    >
      <div class="font-bold text-white tracking-wide">Detektif Kripik</div>
      <div class="flex items-center space-x-6 text-gray-400">
        <span>Kasus: Mr. P.S.</span>
        <div class="flex space-x-4">
          <button class="hover:text-white">&minus;</button>
          <button class="hover:text-white">&#9723;</button>
          <button class="hover:text-red-500">&times;</button>
        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar Kiri (Daftar File) -->
      <aside
        class="w-28 flex flex-col items-center py-6 border-r border-gray-800 space-y-6 overflow-y-auto bg-[#12141a]"
      >
        <!-- Item Non-Aktif -->
        <div
          class="flex flex-col items-center cursor-pointer text-gray-500 hover:text-gray-300"
        >
          <div
            class="w-12 h-14 border border-gray-600 rounded flex items-center justify-center mb-2"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              ></path>
            </svg>
          </div>
          <span class="text-xs text-center">Briefing.txt</span>
        </div>

        <!-- Item Aktif (Bisa diklik untuk memunculkan panel Surat) -->
        <div
          id="sidebar-file"
          class="flex flex-col items-center cursor-pointer text-yellow-500 transition-transform active:scale-95"
        >
          <div
            class="w-12 h-14 border-2 border-yellow-500 rounded flex items-center justify-center mb-2 bg-[#1e2025]"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              ></path>
            </svg>
          </div>
          <span class="text-xs text-center">Surat_Hendra.txt</span>
        </div>

        <!-- Item Terkunci -->
        <div
          class="flex flex-col items-center cursor-pointer text-gray-500 hover:text-gray-300 relative"
        >
          <div
            class="w-12 h-14 border border-gray-600 rounded flex items-center justify-center mb-2 relative"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"
              ></path>
            </svg>
            <!-- Ikon Gembok -->
            <div
              class="absolute -bottom-1 -right-1 bg-[#12141a] rounded-full p-0.5"
            >
              <svg
                class="w-3 h-3 text-yellow-600"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                  clip-rule="evenodd"
                ></path>
              </svg>
            </div>
          </div>
          <span class="text-xs text-center">Rekaman.mp3</span>
        </div>
      </aside>

      <main
        class="flex-1 p-6 relative flex flex-col overflow-hidden"
        id="main-content"
        >
        <div
            id="page-container"
            class="flex-1 flex flex-col overflow-y-auto"
        >
            <!-- HALAMAN AWAL -->
            <div class="flex-1 flex flex-col items-center justify-center text-center">
            <div class="text-6xl text-gray-700 mb-5">⌕</div>

            <h2 class="text-xl font-semibold text-gray-300 mb-2">
                Ruang Kerja Detektif Kripik
            </h2>

            <p class="text-sm text-gray-500">
                Pilih file dari panel sebelah kiri untuk mulai membuka bukti.
            </p>
            </div>
        </div>
        </main>
    </div>

    <!-- Bottom Navigation / Tabs -->
    <footer class="bg-[#12141a] border-t border-gray-800 flex px-6">
      <button
        id="tab-tools"
        class="px-6 py-4 text-sm font-semibold text-gray-500 hover:text-gray-300 tab-btn"
      >
        Tools
      </button>
      <button
        id="tab-add"
        class="px-6 py-4 text-sm font-semibold text-gray-500 hover:text-gray-300 tab-btn"
      >
        Add
      </button>
      <button
        id="tab-rantai"
        class="px-6 py-4 text-sm font-semibold text-gray-500 hover:text-gray-300 tab-btn"
      >
        Rantai Bukti
      </button>
    </footer>

    <script src="./src/js/renderer.js"></script>
  </body>
</html>
