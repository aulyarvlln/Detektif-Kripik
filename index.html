<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detektif Kripik</title>
  <!-- Menggunakan Tailwind CSS via CDN untuk styling cepat -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* Kustomisasi scrollbar agar sesuai tema */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1D191E;
    }

    ::-webkit-scrollbar-thumb {
      background: #45343F;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #66545E;
    }
  </style>
</head>

<body class="bg-[#141214] text-[#F5EFF1] font-sans h-screen flex flex-col overflow-hidden select-none">
  <!-- Top Navigation / Title Bar -->
  <header class="flex justify-between items-center px-4 py-2 bg-[#141214] border-b border-[#45343F] text-sm">
    <div class="font-bold text-[#F5EFF1] tracking-wide">Detektif Kripik</div>
    <div class="flex items-center space-x-6 text-[#AA9DA4]">
      <span>Kasus: Mr. P.S.</span>
      <div class="flex space-x-4">
        <button class="hover:text-[#F5EFF1]">&minus;</button>
        <button class="hover:text-[#F5EFF1]">&#9723;</button>
        <button class="hover:text-[#D77A85]">&times;</button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar Kiri (Daftar File) -->
    <aside class="w-36 flex flex-col items-center py-6 border-r border-[#45343F] overflow-y-auto bg-[#141214]">
      <!-- Daftar dokumen .txt (diisi otomatis oleh renderer.js) -->
      <div id="sidebar-docs" class="flex flex-col items-center space-y-6"></div>
    </aside>

    <main class="flex-1 p-6 relative flex flex-row gap-4 overflow-hidden" id="main-content">
      <!-- Area utama dokumen -->
      <div id="page-container" class="flex-1 min-w-0 flex flex-col overflow-y-auto">
        <!-- HALAMAN AWAL -->
        <div class="flex-1 flex flex-col items-center justify-center text-center">
          <div class="text-6xl text-[#66545E] mb-5">⌕</div>

          <h2 class="text-xl font-semibold text-[#F5EFF1] mb-2">
            Ruang Kerja Detektif Kripik
          </h2>

          <p class="text-sm text-[#AA9DA4]">
            Pilih file dari panel sebelah kiri untuk mulai membuka bukti.
          </p>
        </div>
      </div>

      <!-- Panel Tools di sebelah kanan -->
      <aside id="tools-panel" class="hidden w-[380px] shrink-0 flex-col bg-[#1D191E]
                 border border-[#45343F] rounded-xl overflow-hidden">
        <div class="flex items-center justify-between px-4 py-3 border-b border-[#45343F]">
          <h2 class="text-[#F5EFF1] font-semibold">TOOLS</h2>

          <button id="btn-tutup-tools" type="button" class="text-[#AA9DA4] hover:text-[#D77A85] text-xl">
            &times;
          </button>
        </div>

        <div id="tools-panel-content" class="flex-1 overflow-y-auto p-3"></div>
      </aside>
    </main>

  </div>

  <!-- Bottom Navigation / Tabs -->
  <!-- Bottom Navigation / Tabs -->
  <footer class="bg-[#141214] border-t border-[#45343F] flex items-center px-6">

    <button id="tab-tools"
      class="flex items-center gap-2 px-6 py-4 text-sm font-semibold text-[#AA9DA4] hover:text-[#F5EFF1] tab-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-tools shrink-0"
        viewBox="0 0 16 16">
        <path
          d="M1 0 0 1l2.2 3.081a1 1 0 0 0 .815.419h.07a1 1 0 0 1 .708.293l2.675 2.675-2.617 2.654A3.003 3.003 0 0 0 0 13a3 3 0 1 0 5.878-.851l2.654-2.617.968.968-.305.914a1 1 0 0 0 .242 1.023l3.27 3.27a.997.997 0 0 0 1.414 0l1.586-1.586a.997.997 0 0 0 0-1.414l-3.27-3.27a1 1 0 0 0-1.023-.242L10.5 9.5l-.96-.96 2.68-2.643A3.005 3.005 0 0 0 16 3q0-.405-.102-.777l-2.14 2.141L12 4l-.364-1.757L13.777.102a3 3 0 0 0-3.675 3.68L7.462 6.46 4.793 3.793a1 1 0 0 1-.293-.707v-.071a1 1 0 0 0-.419-.814zm9.646 10.646a.5.5 0 0 1 .708 0l2.914 2.915a.5.5 0 0 1-.707.707l-2.915-2.914a.5.5 0 0 1 0-.708M3 11l.471.242.529.026.287.445.445.287.026.529L5 13l-.242.471-.026.529-.445.287-.287.445-.529.026L3 15l-.471-.242L2 14.732l-.287-.445L1.268 14l-.026-.529L1 13l.242-.471.026-.529.445-.287.287-.445.529-.026z" />
      </svg>
      <span>Tools</span>
    </button>

    <button id="tab-add"
      class="flex items-center gap-2 px-6 py-4 text-sm font-semibold text-[#AA9DA4] hover:text-[#F5EFF1] tab-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
        class="bi bi-file-earmark-plus shrink-0" viewBox="0 0 16 16">
        <path
          d="M8 6.5a.5.5 0 0 1 .5.5v1.5H10a.5.5 0 0 1 0 1H8.5V11a.5.5 0 0 1-1 0V9.5H6a.5.5 0 0 1 0-1h1.5V7a.5.5 0 0 1 .5-.5" />
        <path
          d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z" />
      </svg>
      <span>Add</span>
    </button>

    <button id="tab-rantai"
      class="flex items-center gap-2 px-6 py-4 text-sm font-semibold text-[#AA9DA4] hover:text-[#F5EFF1] tab-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
        class="bi bi-link-45deg shrink-0" viewBox="0 0 16 16">
        <path
          d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1 1 0 0 0-.154.199 2 2 0 0 0 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4 4 0 0 1-.128-1.287z" />
        <path
          d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243z" />
      </svg>
      <span>Rantai Bukti</span>
    </button>

    <button id="tab-file-tambahan"
      class="flex items-center gap-2 px-6 py-4 text-sm font-semibold text-[#AA9DA4] hover:text-[#F5EFF1] tab-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-folder shrink-0"
        viewBox="0 0 16 16">
        <path
          d="M.54 3.87.5 3a2 2 0 0 1 2-2h3.672a2 2 0 0 1 1.414.586l.828.828A2 2 0 0 0 9.828 3h3.982a2 2 0 0 1 1.992 2.181l-.637 7A2 2 0 0 1 13.174 14H2.826a2 2 0 0 1-1.991-1.819l-.637-7a2 2 0 0 1 .342-1.31zM2.19 4a1 1 0 0 0-.996 1.09l.637 7a1 1 0 0 0 .995.91h10.348a1 1 0 0 0 .995-.91l.637-7A1 1 0 0 0 13.81 4zm4.69-1.707A1 1 0 0 0 6.172 2H2.5a1 1 0 0 0-1 .981l.006.139q.323-.119.684-.12h5.396z" />
      </svg>
      <span>File Tambahan</span>
    </button>

  </footer>

  <script src="./src/js/renderer.js"></script>
</body>

</html>
