
<div class="h-full overflow-y-auto p-6 text-white">
    <div class="max-w-5xl mx-auto">
        <div class="mb-6">
            <p class="text-sm text-amber-400 tracking-widest uppercase">Classified Document</p>
            <h1 class="text-3xl font-bold mt-2">Dossier Tersangka</h1>
            <p class="text-gray-400 mt-2">Berkas rahasia penyelidikan kasus kematian Mr. PS.</p>
        </div>

        <div id="dossier-lock" class="max-w-md mx-auto mt-12 p-6 rounded-xl bg-gray-800 border border-gray-700">
            <div class="text-center mb-5">
                <div class="text-4xl mb-3">🔒</div>
                <h2 class="text-xl font-semibold">Akses Dossier</h2>
                <p class="text-sm text-gray-400 mt-2">Masukkan kata kunci untuk membuka berkas tersangka.</p>
            </div>

            <input
                id="password-dossier"
                type="password"
                placeholder="Masukkan kata kunci"
                class="w-full p-3 rounded-lg bg-gray-900 border border-gray-600 text-white"
            >

            <button
                id="btn-buka-dossier"
                class="w-full mt-3 p-3 rounded-lg bg-amber-600 hover:bg-amber-700 font-semibold"
            >
                Buka Dossier
            </button>

            <p id="status-dossier" class="text-sm text-center mt-3 text-gray-400"></p>
        </div>

        <div id="dossier-content" class="hidden">
            <div id="info-kasus" class="mb-6 p-5 rounded-xl bg-gray-800 border border-gray-700"></div>
            <div id="daftar-tersangka" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
            <p class="text-sm text-gray-500 mt-6 text-center">
                Setiap berkas tersangka menyimpan informasi tersembunyi.
            </p>
        </div>
    </div>
</div>
