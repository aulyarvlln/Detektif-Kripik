<div class="p-8 text-gray-200">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-white">File Tambahan</h1>
        <p class="mt-2 text-sm text-gray-400">
            Daftar gambar yang telah ditambahkan melalui fitur Add File.
        </p>
    </div>

    <div class="grid grid-cols-2 gap-6">
        <!-- Daftar file -->
        <div class="rounded-xl border border-gray-700 bg-[#1a1d25] p-5">
            <h2 class="mb-4 font-semibold text-white">Daftar File</h2>

            <div id="daftar-file-tambahan" class="space-y-3">
                <p class="text-sm text-gray-500">
                    Memuat daftar file...
                </p>
            </div>
        </div>

        <!-- Preview file -->
        <div class="rounded-xl border border-gray-700 bg-[#1a1d25] p-5">
            <h2 class="mb-4 font-semibold text-white">Preview File</h2>

            <div
                id="preview-file-tambahan"
                class="flex min-h-64 items-center justify-center rounded-lg border border-dashed border-gray-700 p-4"
            >
                <p class="text-sm text-gray-500">
                    Pilih file untuk melihat gambar.
                </p>
            </div>

            <button
                id="btn-extract-file"
                class="mt-4 w-full rounded-lg bg-amber-600 px-4 py-3 text-sm font-semibold text-white hover:bg-amber-700 disabled:opacity-50"
                disabled
            >
                Extract Pesan Rahasia
            </button>

            <div
                id="hasil-extract-file"
                class="mt-4 rounded-lg border border-gray-700 bg-[#12141a] p-4"
            >
                <h3 class="mb-2 text-sm font-semibold text-white">
                    Isi Pesan Rahasia
                </h3>
                <p class="text-sm text-gray-500">
                    Belum ada pesan yang diekstrak.
                </p>
            </div>
        </div>
    </div>
</div>
