<div class="p-8 text-[#F5EFF1]">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-[#F5EFF1]">File Tambahan</h1>
        <p class="mt-2 text-sm text-[#AA9DA4]">
            Daftar gambar yang telah ditambahkan melalui fitur Add File.
        </p>
    </div>

    <div class="grid grid-cols-2 gap-6">
        <!-- Daftar file -->
        <div class="rounded-xl border border-[#45343F] bg-[#1D191E] p-5">
            <h2 class="mb-4 font-semibold text-[#F5EFF1]">Daftar File</h2>

            <div id="daftar-file-tambahan" class="space-y-3">
                <p class="text-sm text-[#AA9DA4]">
                    Memuat daftar file...
                </p>
            </div>
        </div>

        <!-- Preview file -->
        <div class="rounded-xl border border-[#45343F] bg-[#1D191E] p-5">
            <h2 class="mb-4 font-semibold text-[#F5EFF1]">Preview File</h2>

            <div id="preview-file-tambahan"
                class="flex min-h-64 items-center justify-center rounded-lg border border-dashed border-[#45343F] p-4">
                <p class="text-sm text-[#AA9DA4]">
                    Pilih file untuk melihat gambar.
                </p>
            </div>

            <button id="btn-extract-file"
                class="mt-4 w-full rounded-lg bg-[#A33D50] px-4 py-3 text-sm font-semibold text-[#F5EFF1] hover:bg-[#B94B60] disabled:opacity-50"
                disabled>
                Extract Pesan Rahasia
            </button>

            <div id="hasil-extract-file" class="mt-4 rounded-lg border border-[#45343F] bg-[#141214] p-4">
                <h3 class="mb-2 text-sm font-semibold text-[#F5EFF1]">
                    Isi Pesan Rahasia
                </h3>
                <p class="text-sm text-[#AA9DA4]">
                    Belum ada pesan yang diekstrak.
                </p>
            </div>
        </div>
    </div>
</div>
