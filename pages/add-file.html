
<div id="panel-add" class="bg-[#1a1c23] border border-gray-700 rounded-xl flex-1 flex flex-col shadow-2xl relative">
    <div class="flex justify-between items-center p-4 border-b border-gray-800">
        <h2 class="text-white font-semibold tracking-wide">Add</h2>
        <button class="text-gray-400 hover:text-white">&times;</button>
    </div>

    <div class="p-6 flex-1 overflow-y-auto">
        <h3 class="text-2xl font-bold text-white mb-6">
            Add: tambah file baru
        </h3>

        <div class="flex space-x-6">
            <div class="flex-1 flex flex-col space-y-4">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Input teks</label>
                    <textarea
                        id="pesan-rahasia"
                        placeholder="Tulis pesan..."
                        class="w-full h-32 bg-[#12141a] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-yellow-500 resize-none"></textarea>
                </div>

                <div
                    id="pilih-gambar"
                    class="border-2 border-dashed border-gray-700 rounded-lg p-8 flex flex-col justify-center items-center text-gray-400 hover:text-white hover:border-gray-500 cursor-pointer transition-colors flex-1">

                    <div id="teks-pilih-gambar" class="flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                        Pilih gambar PNG
                    </div>

                    <img
                        id="preview-gambar"
                        class="hidden max-h-64 max-w-full object-contain rounded-lg mt-3"
                        alt="Pratinjau gambar yang dipilih"
                    />
                </div>
            </div>

            <div class="w-72 flex flex-col space-y-4">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Metode</label>
                    <select id="metode-steganografi"
                        class="w-full bg-[#12141a] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-yellow-500 appearance-none">
                        <option value="lsb">LSB (teks ke gambar)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-gray-500 mb-1">Key</label>
                    <input type="text" id="key-steganografi"
                        placeholder="Belum diperlukan"
                        disabled
                        class="w-full bg-[#12141a] border border-gray-700 rounded-lg p-3 text-gray-500 focus:outline-none"/>
                </div>

                <div class="flex-1"></div>

                <button id="btn-simpan-steganografi"
                    class="bg-[#dcb059] hover:bg-yellow-500 text-black font-bold py-3 rounded-lg shadow-lg w-full transition-transform active:scale-95">
                    Save
                </button>
            </div>
        </div>

        <p id="status-steganografi" class="text-gray-400 text-sm mt-4">
            Pilih gambar PNG dan masukkan pesan rahasia.
        </p>

        <p class="text-gray-500 text-sm mt-4">
            Setelah disimpan, file baru muncul di daftar kiri dalam bentuk terenkripsi.
        </p>
    </div>
</div>
