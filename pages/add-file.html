<div id="panel-add" class="bg-[#1D191E] border border-[#45343F] rounded-xl flex-1 flex flex-col shadow-2xl relative">
    <div class="flex justify-between items-center p-4 border-b border-[#45343F]">
        <h2 class="text-[#F5EFF1] font-semibold tracking-wide">Add</h2>
        <button class="text-[#AA9DA4] hover:text-[#F5EFF1]">&times;</button>
    </div>

    <div class="p-6 flex-1 overflow-y-auto">
        <h3 class="text-2xl font-bold text-[#F5EFF1] mb-6">
            Add : tambah file baru
        </h3>

        <p class="text-[#AA9DA4] text-sm mb-6">
            Masukkan pesan rahasia ke dalam gambar PNG menggunakan metode LSB.
        </p>

        <div class="flex space-x-6">
            <div class="flex-1 flex flex-col space-y-4">
                <div>
                    <label class="block text-xs text-[#AA9DA4] mb-1">Input teks</label>
                    <textarea id="pesan-rahasia" placeholder="Tulis pesan..."
                        class="w-full h-32 bg-[#141214] border border-[#45343F] rounded-lg p-3 text-[#F5EFF1] focus:outline-none focus:border-[#B94B60] resize-none"></textarea>
                </div>

                <div id="pilih-gambar"
                    class="border-2 border-dashed border-[#45343F] rounded-lg p-8 flex flex-col justify-center items-center text-[#AA9DA4] hover:text-[#F5EFF1] hover:border-[#66545E] cursor-pointer transition-colors flex-1">

                    <div id="teks-pilih-gambar" class="flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                        Pilih gambar PNG
                    </div>

                    <img id="preview-gambar" class="hidden max-h-64 max-w-full object-contain rounded-lg mt-3"
                        alt="Pratinjau gambar yang dipilih" />
                </div>
            </div>
        </div>

        <p id="status-steganografi" class="text-[#AA9DA4] text-sm mt-4">
            Pilih gambar PNG dan masukkan pesan rahasia.
        </p>

        <p class="text-[#AA9DA4] text-sm mt-4">
            Setelah disimpan, file baru muncul di daftar kiri dalam bentuk terenkripsi.
        </p>

        <button id="btn-simpan-steganografi"
            class=" mt-4 bg-[#A33D50] hover:bg-[#B94B60] text-[#F5EFF1] font-bold py-3 rounded-lg shadow-lg w-full transition-transform active:scale-95">
            Save
        </button>
    </div>
</div>
